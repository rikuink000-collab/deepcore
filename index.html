<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DEEPCORE — 終わらない深層</title>
<style>
:root{--bg:#0a0c11;--c:#141a24;--c2:#1d2635;--tx:#e8edf4;--mu:#8793a6;--ac:#ffb23e;--gr:#4de0a0;--rd:#ff6b6b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#0d1118;border-bottom:1px solid #222c3b;padding:8px 12px;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
header div{font-size:12px;color:var(--mu)}header b{display:block;font-size:19px;color:var(--tx);font-variant-numeric:tabular-nums}
#hg{color:var(--ac)}#hrp{color:#7cc4ff}
main{padding:12px 12px calc(84px + env(safe-area-inset-bottom,0px))}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:#0d1118;border-top:1px solid #222c3b;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{background:none;border:0;color:var(--mu);padding:9px 0 8px;font-size:11px;font-family:inherit}nav button span{display:block;font-size:20px}
nav button.on{color:var(--ac);box-shadow:inset 0 2px var(--ac)}
.card{background:var(--c);border:1px solid #232e40;border-radius:12px;padding:12px;margin-bottom:10px}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}.mu{color:var(--mu);font-size:13px}
.lv{color:var(--ac);font-weight:700}
.bar{height:12px;background:#1a2230;border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8a2b,#ffd54a)}
.orb{display:block;margin:14px auto;width:200px;height:200px;border-radius:50%;border:2px solid #ffb23e66;color:#fff;font-size:64px;font-family:inherit;background:radial-gradient(circle at 35% 30%,#ffd98a,#ff8a2b 38%,#7a2c10 75%,#2a0e06);box-shadow:0 0 40px #ff8a2b55,inset 0 0 30px #0008;transition:transform .06s;touch-action:manipulation}
.orb:active{transform:scale(.94)}.orb small{display:block;font-size:13px;margin-top:-4px}
button.b{width:100%;margin-top:8px;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#1a1000;font-weight:700;font-size:15px;font-family:inherit}
button.b.dis{background:#2a3446;color:#6d7a90}button.b.rd{background:var(--rd);color:#200}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{font-size:12px;padding:3px 8px;border-radius:12px;background:var(--c2);border:1px solid #2b374b}
.chip.no{border-color:var(--rd);color:var(--rd)}.chip.ok{border-color:#2b6a52;color:var(--gr)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.grid div{background:var(--c);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--mu)}.grid b{display:block;color:var(--tx);font-size:15px}
h3{margin:14px 2px 6px;font-size:15px}.eff{font-size:13px;margin:4px 0}.eff b{color:var(--gr)}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1;padding:8px;border-radius:8px;border:1px solid #2b374b;background:var(--c);color:var(--mu);font-family:inherit}.seg button.on{color:var(--ac);border-color:var(--ac)}
#fl{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.f{position:absolute;color:#ffd54a;font-weight:700;text-shadow:0 0 6px #000;animation:fl .8s ease-out forwards}
@keyframes fl{to{transform:translateY(-70px);opacity:0}}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:12px;right:12px;z-index:20;pointer-events:none}
#toast div{background:#222c3bee;border:1px solid var(--ac);border-radius:10px;padding:8px 12px;margin-bottom:6px;font-size:13px}
#modal{position:fixed;inset:0;background:#000a;z-index:30;display:none;align-items:center;justify-content:center;padding:20px}
#modal .card{max-width:420px;width:100%}
.vein{width:100%;padding:12px;border-radius:10px;border:2px dashed var(--gr);background:#0f2a22;color:var(--gr);font-weight:700;font-size:15px;font-family:inherit;margin-bottom:8px}
@media(prefers-reduced-motion:reduce){.f{animation:none}}
</style></head><body>
<header><div>資金<b id="hg">0</b></div><div>研究ポイント<b id="hrp">0</b></div><div>収入/秒<b id="hrate">0</b></div><div>現在深度<b id="hd">0m</b></div></header>
<main id="view"></main>
<nav id="nav"></nav><div id="fl"></div><div id="toast"></div><div id="modal"><div class="card" id="mc"></div></div>
<script>
const KEY='deepcore_save_v1';
const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function fmt(n){if(!isFinite(n))return'∞';if(n<1000)return n<10?n.toFixed(2):n<100?n.toFixed(1):n.toFixed(0);const e=Math.floor(Math.log10(n)/3);if(e<SUF.length)return(n/Math.pow(1000,e)).toFixed(2)+SUF[e];return n.toExponential(2).replace('+','')}
function ft(s){s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+'時間'+m+'分':m?m+'分':s+'秒'}
/* ===== データ定義（拡張はここに追加） ===== */
const ORES=[{id:'rock',n:'岩石',v:1,u:0,c:'#9aa3b2'},{id:'cu',n:'銅鉱石',v:2.5,u:0,c:'#e8884a'},{id:'coal',n:'石炭',v:3,u:0,c:'#b9a8d8'},{id:'fe',n:'鉄鉱石',v:4,u:10,c:'#8fb3d9'},{id:'ag',n:'銀',v:15,u:25,c:'#dfe7f3'},{id:'au',n:'金',v:60,u:50,c:'#ffd54a'},{id:'cr',n:'希少結晶',v:300,u:100,c:'#6ef0ff'}];
const OV={};ORES.forEach(o=>OV[o.id]=o.v);const ON={};ORES.forEach(o=>ON[o.id]=o);
const LAYERS=[{d:0,n:'表土層',w:{rock:.6,cu:.25,coal:.15}},{d:10,n:'銅鉄層',w:{rock:.35,cu:.3,fe:.25,coal:.1}},{d:25,n:'銀脈層',w:{rock:.25,cu:.2,fe:.25,coal:.1,ag:.2}},{d:50,n:'黄金層',w:{rock:.2,cu:.1,fe:.2,coal:.1,ag:.2,au:.2}},{d:100,n:'結晶層',w:{rock:.15,fe:.2,coal:.1,ag:.2,au:.2,cr:.15}}];
const lm=l=>Math.pow(2,Math.floor(l/25));
const F=[
{id:'miner',n:'採掘機',ic:'⛏',g:20,r:1.2,res:{rock:10},u:0,d:'鉱石を自動で採掘し、少しずつ掘り進む',e:l=>'自動採掘 '+fmt(2*l*lm(l))+'/秒'},
{id:'drill',n:'強化型ドリル',ic:'🔩',g:100,r:1.23,res:{cu:10,rock:40},u:0,d:'タップの採掘力を向上',e:l=>'採掘力 ×'+fmt(1+.5*l*lm(l))},
{id:'refine',n:'精錬所',ic:'🔥',g:500,r:1.26,res:{fe:20,rock:150},u:3,d:'鉱石を加工して売却益を増やす',e:l=>'売却益 ×'+fmt(1+.3*l)},
{id:'drone',n:'運搬ドローン',ic:'🛸',g:1000,r:1.26,res:{coal:30,rock:300},u:6,d:'資源の処理能力を向上',e:l=>'処理能力 ×'+fmt(1+.2*l)},
{id:'lab',n:'研究所',ic:'🔬',g:4000,r:1.28,res:{cu:100,fe:50,rock:1000},u:10,d:'研究ポイントを生産',e:l=>'研究 '+fmt(.1*l*lm(l))+' RP/秒'},
{id:'big',n:'大型掘削機',ic:'🚜',g:15000,r:1.28,res:{fe:300,coal:200,rock:5000},u:14,d:'深層への掘進を支援',e:l=>'掘進 '+fmt(3*l*lm(l))+'/秒'}];
const T=(id,br,n,cost,pre,fx,d)=>({id,br,n,cost,pre,fx,d});
const BR={mine:'採掘技術',auto:'自動化技術',ref:'精錬技術',deep:'深層技術',tr:'超越技術'};
const TECH=[
T('m1','mine','強化工具',10,0,{pow:1.5},'採掘力 ×1.5'),T('m2','mine','高効率採掘',40,'m1',{gain:1.5},'資源獲得量 ×1.5'),T('m3','mine','探鉱術',150,'m2',{rare:2},'レア素材の発見率 ×2'),
T('a1','auto','採掘機改良',15,0,{auto:1.5},'自動採掘 ×1.5'),T('a2','auto','搬送最適化',60,'a1',{drone:1.5},'ドローン効果 ×1.5'),T('a3','auto','自動増設',250,'a2',{ab:1},'採掘機を資金に応じ自動で強化'),
T('r1','ref','高純度精錬',25,0,{sell:1.5},'売却益 ×1.5'),T('r2','ref','触媒精錬',100,'r1',{sell:2},'売却益 ×2'),T('r3','ref','資源変換',400,'r2',{gain:2},'資源獲得量 ×2'),
T('d1','deep','掘進強化',30,0,{dig:1.5},'掘進速度 ×1.5'),T('d2','deep','振動掘削',120,'d1',{dig:2},'掘進速度 ×2'),T('d3','deep','深層測量',450,'d2',{dig:2,rare:1.5},'掘進 ×2・レア発見 ×1.5'),
T('t1','tr','転生理論',80,'d1',{pp:1.25},'転生ポイント ×1.25'),T('t2','tr','保管庫拡張',60,'a1',{offcap:4},'オフライン上限 +4時間'),T('t3','tr','遠隔採掘',200,'t2',{offeff:.25},'オフライン効率 +25%')];
TECH.forEach(t=>t.cost*=4);
const PU=[{id:'mine',n:'採掘量倍率',b:3,d:'採掘量 +50%/Lv'},{id:'start',n:'初期資金',b:2,d:'開始資金 +200/Lv'},{id:'auto',n:'自動採掘効率',b:3,d:'自動採掘 +20%/Lv'},{id:'rare',n:'希少素材発見率',b:4,d:'発見率 +30%/Lv'},{id:'res',n:'研究速度',b:4,d:'研究 +20%/Lv'},{id:'pp',n:'転生報酬',b:6,d:'獲得Pt +15%/Lv'}];
const PRES_D=50;
/* ===== 状態 ===== */
const def=()=>{const s={v:1,t:Date.now(),G:10,RP:0,res:{},f:{},pu:{},rs:{},d:0,mx:0,prog:0,relics:0,pp:0,pr:0,tot:0,bm:1};ORES.forEach(o=>s.res[o.id]=0);F.forEach(f=>s.f[f.id]=0);PU.forEach(p=>s.pu[p.id]=0);return s};
let S,C,last=Date.now(),tab='mine',touching=false,lastG=0,rate=0,cP=0,cR=0,vein=0,nextVein=Date.now()+20000;
function load(){S=def();try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.v===1){for(const k of['G','RP','d','mx','prog','relics','pp','pr','tot','t'])if(Number.isFinite(r[k])&&r[k]>=0)S[k]=r[k];S.d=Math.floor(S.d);S.mx=Math.max(S.mx,S.d);if(r.bm===10)S.bm=10;for(const g of['res','f','pu'])if(r[g])for(const k in S[g])if(Number.isFinite(r[g][k])&&r[g][k]>=0)S[g][k]=r[g][k];if(r.rs)TECH.forEach(t=>{if(r.rs[t.id])S.rs[t.id]=true});return true}}catch(e){}return false}
function save(){try{S.t=Date.now();localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const M=k=>TECH.reduce((a,t)=>S.rs[t.id]&&t.fx[k]!=null?a*t.fx[k]:a,1);
const A=k=>TECH.reduce((a,t)=>S.rs[t.id]&&t.fx[k]!=null?a+t.fx[k]:a,0);
function calc(){const L=S.f,P=S.pu;const g=(1+.05*S.relics)*(1+.5*P.mine)*(1+.1*S.pr)*M('gain');const Tt=(1+.2*L.drone)*M('drone');
const tap=(1+.5*L.drill*lm(L.drill))*M('pow')*Tt*g;const auto=L.miner*2*lm(L.miner)*M('auto')*(1+.2*P.auto)*Tt*g;
const dig=(L.miner*.6+L.big*3*lm(L.big))*M('dig');const req=1.2*Math.pow(1.07,S.d);const eff=Math.max(.05,Math.min(1,tap/req));
return{g,tap,auto,dig,req,eff,sell:(1+.3*L.refine)*M('sell'),rp:L.lab*.1*lm(L.lab)*(1+.2*P.res)*M('rp')}}
const layerAt=d=>{let l=LAYERS[0];for(const x of LAYERS)if(x.d<=d)l=x;return l};
const hp=d=>60*Math.pow(1.12,d);
function mineU(P){const d=S.d,L=layerAt(d),r=M('rare')*(1+.3*S.pu.rare);let s=0;const w={};for(const o in L.w){w[o]=L.w[o]*(o==='ag'||o==='au'||o==='cr'?r:1);s+=w[o]}
const m=Math.pow(1.05,d);for(const o in w){const a=P*w[o]/s*m;S.res[o]+=o==='rock'?a:a*.5;const g=a*OV[o]*C.sell*.2;S.G+=g;S.tot+=g}}
function dig(x){S.prog+=x;let n=0;while(S.prog>=hp(S.d)&&n++<500){S.prog-=hp(S.d);S.d++;if(S.d>S.mx)S.mx=S.d;
if(S.d%5===0&&Math.random()<Math.min(.9,.2*M('rare'))){S.relics++;toast('🏺 古代遺物を発見！ 全体 +5%')}
const ly=LAYERS.find(l=>l.d===S.d&&l.d>0);if(ly&&S.d===S.mx)toast('新しい地層：'+ly.n);C=calc()}}
function cost(f,l,n){const k=n>1?(Math.pow(f.r,n)-1)/(f.r-1):1,m=Math.pow(f.r,l)*k,c={G:f.g*m};for(const o in f.res)c[o]=f.res[o]*m;return c}
const aff=c=>{for(const k in c)if((k==='G'?S.G:S.res[k])<c[k])return false;return true};
const pay=c=>{for(const k in c){if(k==='G')S.G-=c[k];else S.res[k]-=c[k]}};
function buy(i){const f=F[i];if(S.mx<f.u)return 0;const c=cost(f,S.f[f.id],S.bm);if(!aff(c))return 0;pay(c);S.f[f.id]+=S.bm;return S.bm}
function step(dt,off){C=calc();mineU(C.auto*dt);S.RP+=C.rp*dt;dig(C.dig*dt*C.eff);
if(A('ab')>0){let n=0;while(n++<5){const c=cost(F[0],S.f.miner,1);if(aff(c)){pay(c);S.f.miner++}else break}}}
function doOffline(dt){const cap=(4+A('offcap'))*3600,use=Math.min(dt,cap),eff=Math.min(1,.5+A('offeff')),tot=use*eff;
const b={G:S.G,RP:S.RP,d:S.d,r:{...S.res},rl:S.relics};const n=Math.min(200,Math.ceil(tot/30)||1);for(let i=0;i<n;i++)step(tot/n,true);
if(dt>=60){let rows='';ORES.forEach(o=>{const x=S.res[o.id]-b.r[o.id];if(x>0)rows+=`<span class="chip" style="color:${o.c}">${o.n} +${fmt(x)}</span>`});
$('#mc').innerHTML=`<h3 style="margin-top:0">おかえりなさい</h3><div class="mu">経過 ${ft(dt)}（反映 ${ft(use)} / 効率 ${Math.round(eff*100)}%）</div><div class="eff">資金 <b>+${fmt(S.G-b.G)}</b><br>研究 <b>+${fmt(S.RP-b.RP)}</b><br>深度 <b>+${S.d-b.d}m</b>${S.relics>b.rl?'<br>遺物 <b>+'+(S.relics-b.rl)+'</b>':''}</div><div class="chips">${rows}</div><button class="b" data-act="close">受け取る</button>`;$('#modal').style.display='flex'}}
/* ===== UI ===== */
const $=s=>document.querySelector(s);
function toast(t){const e=document.createElement('div');e.textContent=t;$('#toast').appendChild(e);setTimeout(()=>e.remove(),2800)}
function float(x,y,t){const e=document.createElement('span');e.className='f';e.textContent=t;e.style.left=(x-20+Math.random()*30)+'px';e.style.top=(y-30)+'px';$('#fl').appendChild(e);setTimeout(()=>e.remove(),800);if($('#fl').children.length>24)$('#fl').firstChild.remove()}
function doTap(x,y){C=calc();const g=S.G;mineU(C.tap);dig(C.tap*.5*C.eff);float(x,y,'+'+fmt(S.G-g))}
const chipCost=c=>Object.keys(c).map(k=>{const have=k==='G'?S.G:S.res[k],ok=have>=c[k],nm=k==='G'?'資金':ON[k].n;return`<span class="chip ${ok?'ok':'no'}">${nm} ${fmt(have)} / ${fmt(c[k])}</span>`}).join('');
const NAV=[['mine','⛏','採掘'],['fac','🏭','設備'],['exp','🧭','探索'],['res','🔬','研究'],['pre','♻','転生']];
$('#nav').innerHTML=NAV.map(n=>`<button data-act="tab:${n[0]}" data-t="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`).join('');
function hdr(){$('#hg').textContent=fmt(S.G);$('#hrp').textContent=fmt(S.RP);$('#hrate').textContent=fmt(rate);$('#hd').textContent=S.d+'m';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab))}
function oreChips(){return ORES.filter(o=>S.mx>=o.u).map(o=>`<span class="chip" style="color:${o.c};border-color:${o.c}55">${o.n} ${fmt(S.res[o.id])}</span>`).join('')}
function nextUnlock(){const it=[];LAYERS.forEach(l=>{if(l.d>S.mx)it.push([l.d,'地層「'+l.n+'」'])});F.forEach(f=>{if(f.u>S.mx)it.push([f.u,f.n+'を解放'])});ORES.forEach(o=>{if(o.u>S.mx)it.push([o.u,o.n+'が出現'])});it.sort((a,b)=>a[0]-b[0]);return it[0]}
function view(){let h='';
if(tab==='mine'){h=`<div class="card"><div class="r"><b id="ly"></b><span class="lv" id="dp"></span></div><div class="bar"><i id="pb"></i></div><div class="mu" id="pt"></div></div><div id="vn"></div><button class="orb" data-tap="1">⛏<small>タップで採掘</small></button><div class="grid" id="st"></div><h3>所持資源</h3><div class="chips" id="rs"></div>`}
else if(tab==='fac'){h=`<div class="seg"><button data-act="bm:1" class="${S.bm===1?'on':''}">×1</button><button data-act="bm:10" class="${S.bm===10?'on':''}">×10</button></div><div class="card"><b>所持資源</b><div class="chips"><span class="chip" style="color:var(--ac)">資金 ${fmt(S.G)}</span><span class="chip" style="color:#7cc4ff">研究 ${fmt(S.RP)}</span>${oreChips()}</div></div>`;
F.forEach((f,i)=>{const l=S.f[f.id];if(S.mx<f.u){h+=`<div class="card"><b>🔒 ${f.n}</b><div class="mu">深度 ${f.u}m に到達で解放</div></div>`;return}
const c=cost(f,l,S.bm),ok=aff(c);h+=`<div class="card"><div class="r"><b>${f.ic} ${f.n}</b><span class="lv">Lv ${l}</span></div><div class="mu">${f.d}</div><div class="eff">${f.e(l)} → <b>${f.e(l+S.bm)}</b></div><div class="mu">Lv${(Math.floor(l/25)+1)*25}で効果2倍</div><div class="chips">${chipCost(c)}</div><button class="b ${ok?'':'dis'}" data-act="buy:${i}">購入 ×${S.bm}</button></div>`})}
else if(tab==='exp'){const nx=nextUnlock(),c=calc();h=`<div class="card"><div class="r"><b>${layerAt(S.d).n}</b><span class="lv">${S.d}m</span></div><div class="grid" style="margin-top:8px"><div>最深到達<b>${S.mx}m</b></div><div>次の解放<b>${nx?nx[0]+'m：'+nx[1]:'すべて解放済み'}</b></div><div>必要な採掘力<b>${fmt(c.req)}</b></div><div>現在の採掘力<b style="color:${c.eff<1?'var(--rd)':'var(--gr)'}">${fmt(c.tap)}</b></div></div><div class="mu" style="margin-top:6px">採掘力が不足すると掘進が遅くなります（現在 ${Math.round(c.eff*100)}%）。</div></div><div class="card"><b>🏺 古代遺物 ${S.relics}個</b><div class="mu">全生産 +${S.relics*5}%（恒久）。5mごとに発見の可能性があり、レア発見率で上昇。</div></div><h3>地層</h3>`;
LAYERS.forEach(l=>{const o=S.mx>=l.d;h+=`<div class="card" style="opacity:${o?1:.55}"><b>${o?'':'🔒 '}${l.n}</b> <span class="mu">${l.d}m〜</span><div class="chips">${Object.keys(l.w).map(k=>`<span class="chip" style="color:${ON[k].c}">${ON[k].n}</span>`).join('')}</div></div>`})}
else if(tab==='res'){h=`<div class="card"><b>研究ポイント ${fmt(S.RP)}</b><div class="mu">生産 ${fmt(calc().rp)} RP/秒（研究所で増加）</div></div>`;
for(const b in BR){h+=`<h3>${BR[b]}</h3>`;TECH.filter(t=>t.br===b).forEach(t=>{const done=S.rs[t.id],pre=t.pre&&!S.rs[t.pre],pn=t.pre?TECH.find(x=>x.id===t.pre).n:'',ok=!done&&!pre&&S.RP>=t.cost;
h+=`<div class="card"><div class="r"><b>${t.n}</b><span class="mu">${done?'✔ 研究済み':fmt(t.cost)+' RP'}</span></div><div class="eff">${t.d}</div>${done?'':pre?`<div class="mu">前提：${pn}</div>`:`<button class="b ${ok?'':'dis'}" data-act="rs:${t.id}">研究する</button>`}</div>`})}}
else{const g=pgain(),can=S.d>=PRES_D;
h=`<div class="card"><div class="r"><b>転生ポイント</b><span class="lv">${S.pp} Pt</span></div><div class="mu">転生回数 ${S.pr}回（全生産 +${S.pr*10}%）</div></div><div class="card"><b>転生する</b><div class="mu">深度 ${PRES_D}m 以上で可能（現在 ${S.d}m）</div><div class="eff">獲得予定：<b>+${g} Pt</b></div><div class="mu">リセット：資金・鉱石・設備レベル・深度・研究ポイント<br>維持：研究済み技術・遺物・最大深度・転生Pt・転生強化</div><button class="b ${can?'rd':'dis'}" data-act="pres">${cP&&can?'もう一度タップで転生を実行':'転生する'}</button></div><h3>恒久強化</h3>`;
PU.forEach(p=>{const l=S.pu[p.id],c=Math.ceil(p.b*Math.pow(1.7,l));h+=`<div class="card"><div class="r"><b>${p.n}</b><span class="lv">Lv ${l}</span></div><div class="mu">${p.d}</div><button class="b ${S.pp>=c?'':'dis'}" data-act="pu:${p.id}">強化 ${c} Pt</button></div>`});
h+=`<h3>データ</h3><button class="b dis" data-act="wipe">${cR?'もう一度タップで全データを初期化':'セーブデータを初期化'}</button>`}
$('#view').innerHTML=h;if(tab==='mine')updMine();hdr()}
function updMine(){const c=calc(),need=hp(S.d),ly=layerAt(S.d),nx=nextUnlock();
$('#ly').textContent=ly.n;$('#dp').textContent=S.d+'m';$('#pb').style.width=Math.min(100,S.prog/need*100)+'%';
$('#pt').textContent='掘進 '+fmt(S.prog)+' / '+fmt(need)+(nx?'　次の解放：'+nx[0]+'m '+nx[1]:'');
$('#st').innerHTML=`<div>タップ採掘力<b>${fmt(c.tap)}</b></div><div>自動採掘<b>${fmt(c.auto)}/秒</b></div><div>掘進速度<b>${fmt(c.dig*c.eff)}/秒</b></div><div>掘進効率<b style="color:${c.eff<1?'var(--rd)':'var(--gr)'}">${Math.round(c.eff*100)}%</b></div>`;
$('#rs').innerHTML=oreChips();$('#vn').innerHTML=Date.now()<vein?'<button class="vein" data-vein="1">✨ 鉱脈発見！ タップして大量採掘</button>':''}
function act(a){const[k,v]=a.split(':');
if(k==='tab'){tab=v;cP=cR=0;view();window.scrollTo(0,0);return}
if(k==='close'){$('#modal').style.display='none';return}
if(k==='bm')S.bm=+v;
else if(k==='buy')buy(+v);
else if(k==='rs'){const t=TECH.find(x=>x.id===v);if(t&&!S.rs[v]&&(!t.pre||S.rs[t.pre])&&S.RP>=t.cost){S.RP-=t.cost;S.rs[v]=true}}
else if(k==='pu'){const p=PU.find(x=>x.id===v),c=Math.ceil(p.b*Math.pow(1.7,S.pu[v]));if(S.pp>=c){S.pp-=c;S.pu[v]++}}
else if(k==='pres'){if(S.d<PRES_D)return;if(!cP){cP=1}else{prestige();cP=0}}
else if(k==='wipe'){if(!cR){cR=1}else{localStorage.removeItem(KEY);S=def();cR=0;toast('データを初期化しました')}}
C=calc();view();save()}
const pgain=()=>Math.floor(Math.pow(S.d/25,2.2)*(1+.15*S.pu.pp)*M('pp'));
function prestige(){const g=pgain(),n=def();S.pp+=g;S.pr++;S.G=10+200*S.pu.start;S.RP=0;S.res=n.res;S.f=n.f;S.d=0;S.prog=0;lastG=S.G;toast('転生完了！ +'+g+' Pt')}
document.addEventListener('pointerdown',e=>{touching=true;const t=e.target.closest('[data-tap]');if(t){doTap(e.clientX,e.clientY);hdr();updMine();return}
const v=e.target.closest('[data-vein]');if(v&&Date.now()<vein){vein=0;C=calc();const g=S.G;mineU(C.tap*40);dig(C.tap*10);toast('鉱脈から資金 +'+fmt(S.G-g));updMine()}});
document.addEventListener('pointerup',()=>touching=false);document.addEventListener('pointercancel',()=>touching=false);
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)act(b.dataset.act)});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});window.addEventListener('pagehide',save);
/* ===== 起動 ===== */
const had=load();C=calc();if(had){const dt=(Date.now()-S.t)/1000;if(dt>10)doOffline(dt)}lastG=S.G;last=Date.now();save();
setInterval(()=>{const n=Date.now();let dt=(n-last)/1000;last=n;if(dt<0)dt=0;
if(dt>10)doOffline(dt);else{step(dt);if(n>nextVein&&Date.now()>=vein){vein=n+12000;nextVein=n+30000+Math.random()*40000;toast('✨ 鉱脈を発見！採掘画面でタップ')}}
const inst=Math.max(0,(S.G-lastG)/Math.max(dt,.05));lastG=S.G;rate=rate*.85+inst*.15;if(!Number.isFinite(rate))rate=0},100);
setInterval(()=>{hdr();if(tab==='mine')updMine();else if(!touching)view()},400);
setInterval(save,5000);
view();
</script></body></html>
